  <!-- Firebase REST API (no WebSocket) -->
  <script>
    (function() {
      const PROJECT = 'ap-recipe';
      const API_KEY = 'AIzaSyB5z7rKBxI-sXkQsO5mTMtmFzmyPVNVbeA';
      const BASE    = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents';
      const DOC_URL = BASE + '/ap_system/recipes?key=' + API_KEY;

      window._fsReady = false;
      window._pendingCloudSave = false;

      function dbg(msg, isErr=false) {
        console.log('[Firebase]', msg);
        const el = document.getElementById('sync-status');
        if (!el) return;
        el.textContent = msg;
        el.style.color   = isErr ? 'var(--danger)' : 'var(--success)';
        el.style.opacity = '1';
        clearTimeout(window._syncTimer);
        if (!isErr) window._syncTimer = setTimeout(() => { el.style.opacity = '0'; }, 5000);
      }

      // ── 寫入：PUT (create or overwrite) ──
      window.saveToCloud = async function(data, customersData, materialsData) {
        try {
          const count = Object.keys(data).length;
          dbg('寫入雲端中... (' + count + ' 筆)');
          const custData = customersData || (typeof window._getCustomers === 'function' ? window._getCustomers() : []);
          const matData  = materialsData  || (typeof window._getMaterials  === 'function' ? window._getMaterials()  : []);

          const body = {
            fields: {
              data:      { stringValue: JSON.stringify(data) },
              count:     { integerValue: String(count) },
              customers:  { stringValue: JSON.stringify(custData) },
              materials:  { stringValue: JSON.stringify(matData) },
              updatedAt: { integerValue: String(Date.now()) }
            }
          };

          const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('超時 15 秒')), 15000));
          const req = fetch(DOC_URL, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });

          const res = await Promise.race([req, timeout]);
          if (!res.ok) {
            const err = await res.text();
            throw new Error('HTTP ' + res.status + ': ' + err);
          }

          window._pendingCloudSave = false;
          dbg('✅ 雲端寫入成功 (' + count + ' 筆)');
          return true;
        } catch(e) {
          dbg('❌ 寫入失敗: ' + e.message, true);
          console.error('saveToCloud error:', e);
          return false;
        }
      };

      // ── 讀取：GET ──
      window._getCloudRaw = async function() {
        try {
          const res = await fetch(DOC_URL);
          if (res.status === 404) return null;
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const doc = await res.json();
          if (!doc.fields || !doc.fields.data) return null;
          const recipes = JSON.parse(doc.fields.data.stringValue);
          const customers = doc.fields.customers ? JSON.parse(doc.fields.customers.stringValue) : null;
          const materials = doc.fields.materials ? JSON.parse(doc.fields.materials.stringValue) : null;
          return { recipes, customers, materials };
        } catch(e) {
          console.error('_getCloudRaw error:', e);
          return null;
        }
      };

      window.reloadFromCloud = async function(silent=false) {
        try {
          if (!silent) dbg('讀取雲端中...');
          const cloudRaw = await window._getCloudRaw();
          window._fsReady = true;

          if (!cloudRaw) {
            dbg('雲端無資料，推送本機資料');
            const local = window._getRecipes();
            const localCust = typeof window._getCustomers === 'function' ? window._getCustomers() : [];
            dbg('本機筆數: ' + Object.keys(local).length);
            await window.saveToCloud(local, localCust);
            return;
          }

          const cloudData  = cloudRaw.recipes;
          const cloudCust  = cloudRaw.customers;
          const cloudCount = Object.keys(cloudData).length;
          const local      = window._getRecipes();
          const localCount = Object.keys(local).length;
          dbg('雲端: ' + cloudCount + ' 筆 / 本機: ' + localCount + ' 筆');

          if (localCount > cloudCount) {
            dbg('本機較多，推送至雲端...');
            const localCust = typeof window._getCustomers === 'function' ? window._getCustomers() : [];
            await window.saveToCloud(local, localCust);
          } else {
            dbg('套用雲端資料 (' + cloudCount + ' 筆)');
            window._applyRecipes(cloudData);
            // Apply cloud customers if available
            if (cloudCust && typeof window._applyCustomers === 'function') {
              window._applyCustomers(cloudCust);
            }
            if (cloudRaw.materials && typeof window._applyMaterials === 'function') {
              window._applyMaterials(cloudRaw.materials);
            }
          }

          if (window._pendingCloudSave) {
            dbg('補傳待傳資料...');
            const localCust = typeof window._getCustomers === 'function' ? window._getCustomers() : [];
            await window.saveToCloud(window._getRecipes(), localCust);
          }

        } catch(e) {
          dbg('❌ 連線失敗: ' + e.message, true);
          window._fsReady = false;
        }
      };

      function waitAndSync() {
        if (typeof window._getRecipes === 'function' && typeof window._applyRecipes === 'function') {
          dbg('橋接函數就緒，開始同步');
          window._fsReady = true;
          window.reloadFromCloud(false);
        } else {
          setTimeout(waitAndSync, 100);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', waitAndSync);
      } else {
        waitAndSync();
      }
    })();
  </script>
</head>

<style id="login-style">
#login-screen{position:fixed;inset:0;background:#0e0f13;z-index:9999;display:flex;align-items:center;justify-content:center}

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">&#9650; AP</div>
    <div class="login-sub">智慧配方管理系統</div>
    <input class="login-inp" id="pw-inp" type="password" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">進入系統</button>
    <div class="login-err" id="pw-err"></div>
  </div>
</div>
<script>
(function(){
  if(localStorage.getItem('ap_auth')==='1'){
    window.addEventListener('DOMContentLoaded',function(){
      var s=document.getElementById('login-screen');
      if(s)s.style.display='none';
      var st=document.getElementById('login-style');
      if(st)st.remove();
    });
  }
})();
function doLogin(){
  var pw=document.getElementById('pw-inp').value;
  if(pw==='123456abc'){
    document.getElementById('login-screen').style.display='none';
    var st=document.getElementById('login-style');if(st)st.remove();
    localStorage.setItem('ap_auth','1');
  } else {
    document.getElementById('pw-err').textContent='密碼錯誤，請重試';
    document.getElementById('pw-inp').value='';
    document.getElementById('pw-inp').focus();
  }
}
</script>

function allIngs(){const s=new Set();Object.values(recipes).forEach(r=>r.ingredients.forEach(i=>s.add(i.name)));return s.size;}
function sortedKeys(keys){return keys.sort((a,b)=>{const so={'200色':1,'G系列':2,'J系列':3,'Nude':4,'特殊':5};const sa=series(a),sb=series(b);if(so[sa]!==so[sb])return so[sa]-so[sb];return a.localeCompare(b,'zh-TW',{numeric:true});});}

// ===== LOCALSTORAGE PERSISTENCE =====
const LS_KEY = 'ap_recipes_v1';

function saveToLS() {
  // Save to localStorage only (fast, no quota)
  // Cloud sync happens explicitly via saveToCloud() after user actions
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(recipes));
  } catch(e) {
    console.warn('localStorage save failed:', e);
  }
}

function loadFromLS() {
  // localStorage used as fast initial load / offline fallback
  // Cloud sync (getDoc) runs once on page load via reloadFromCloud()
  try {
    const saved = localStorage.getItem(LS_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Object.keys(parsed).length > 0) {
        recipes = parsed;
        return true;
      }
    }
  } catch(e) {
    console.warn('localStorage load failed:', e);
  }
  return false;
}

function resetToDefault() {
  if (!confirm('確定要還原成原始配方資料嗎？\n所有在網站上新增/修改的配方將會消失！')) return;
  recipes = JSON.parse(JSON.stringify(RAW));
  saveToLS();cloudSync();
  refreshAll();
  toast('已還原成原始配方資料');
}

function exportRecipes() {
  // Export current recipes as JSON file for backup
  const data = JSON.stringify(recipes, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'AP配方備份_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('備份檔案已下載 ✓');
}

function importJsonBackup(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (typeof parsed !== 'object' || Object.keys(parsed).length === 0) throw new Error('格式錯誤');
      recipes = parsed;
      saveToLS();cloudSync();
      refreshAll();
      toast('備份還原成功，共 ' + Object.keys(parsed).length + ' 筆配方 ✓');
    } catch(err) {
      alert('還原失敗：' + err.message);
    }
  };
  reader.readAsText(file);
}

function switchCustomer(id) {

  const c = customers.find(x => x.id === id);
  const label = c && c.id !== 'all' ? c.name + ' 的配方' : '全部配方';
  document.getElementById('s-results').title = label;

function showCustomerBadge(c) {
  const badge = document.getElementById('customer-badge');
  if (!badge) return;
  if (!c || c.id === 'all') { badge.style.display='none'; return; }
  badge.textContent = c.name;
  badge.style.display = 'inline-block';
}

function colorMatchesCustomer(colorId, customerId) {
  if (customerId === 'all') return true;
  const c = customers.find(x => x.id === customerId);
  if (!c || !c.patterns.length) return true;
  return c.patterns.some(p => {
    if (p.startsWith('num:')) {
      const [, range] = p.split(':');
      const [min, max] = range.split('-').map(Number);
      const num = parseInt(colorId);
      return !isNaN(num) && num >= min && num <= max;
    }
    if (p.startsWith('prefix:')) {
      const prefix = p.split(':')[1];
      return colorId.toUpperCase().startsWith(prefix.toUpperCase());
    }
    return false;
  });
}

  const sel = document.getElementById('customer-select');

function filterSearch(){
  const q=document.getElementById('sinp').value.trim().toLowerCase();
  const keys=sortedKeys(Object.keys(recipes).filter(n=>{
    if(!colorMatchesCustomer(n, currentCustomer))return false;
    if(curSer.search!=='全部'&&series(n)!==curSer.search)return false;
    if(!q)return true;
    return n.toLowerCase().includes(q)||recipes[n].ingredients.some(i=>i.name.toLowerCase().includes(q));
  }));
  document.getElementById('s-results').textContent=keys.length;
  renderGrid('grid-search',keys,false);
}
function filterManage(){
  const q=document.getElementById('minp').value.trim().toLowerCase();
  const keys=sortedKeys(Object.keys(recipes).filter(n=>{
    if(!colorMatchesCustomer(n, currentCustomer))return false;
    if(curSer.manage!=='全部'&&series(n)!==curSer.manage)return false;
    if(!q)return true;
    return n.toLowerCase().includes(q)||recipes[n].ingredients.some(i=>i.name.toLowerCase().includes(q));
  }));
  renderGrid('grid-manage',keys,true);
}
function clearSearch(){document.getElementById('sinp').value='';filterSearch();}

function renderGrid(cid,keys,isM){
  const c=document.getElementById(cid);
  if(!keys.length){c.innerHTML='<div class="empty"><div style="font-size:42px">🔍</div>找不到符合的配方</div>';return;}
  c.innerHTML=keys.map(n=>{
    const r=recipes[n];if(!r)return'';
    const si=sortI(r.ingredients);
    const prev=si.slice(0,4).map(i=>i.name).join('、')+(si.length>4?`…+${si.length-4}`:'');
    const sr=series(n);const sc=SC[sr]||'s-sp';
    const fn=isM?`openEdit('${n}')`:`openDetail('${n}')`;
    return`<div class="recipe-card" onclick="${fn}"><div class="recipe-card-num">${n}</div><div class="recipe-card-ingredients">${prev}</div><div class="recipe-card-footer"><span class="sbadge ${sc}">${sr}</span><span style="font-size:10px">${r.ingredients.length}種 / ${r.total_g.toFixed(2)}g</span></div></div>`;
  }).join('');
}

function addIngRow(name='',g=''){
  const c=document.getElementById('em-ings');

  // 優先用 materials 清單，如果還沒載入就用 CATS
  const catOrder = ['基料','色漿','螢光粉','染料','亮粉','其他'];
  let opts = '';
  if (typeof materials !== 'undefined' && materials.length > 0) {
    // 用 materials 分組建選單
    const groups = {};
    for (const m of materials) {
      if (!groups[m.cat]) groups[m.cat] = [];
      groups[m.cat].push(m.name);
    }
    opts = catOrder.filter(cat => groups[cat]).map(cat =>
      `<optgroup label="▸${cat}">${groups[cat].sort().map(i=>`<option value="${i}"${i===name?'selected':''}>${i}</option>`).join('')}</optgroup>`
    ).join('');
  } else {
    // fallback: 用 CATS
    opts = Object.entries(CATS).map(([cat,items])=>
      `<optgroup label="▸${cat}">${items.map(i=>`<option value="${i}"${i===name?'selected':''}>${i}</option>`).join('')}</optgroup>`
    ).join('');
  }

  const row=document.createElement('div');row.className='form-row';
  row.innerHTML=`<select class="finp" style="flex:1.1"><option value="">選擇原料</option>${opts}</select><input class="finp" type="text" placeholder="原料名稱" value="${name}" style="flex:1"><input class="finp num" type="number" placeholder="g" min="0" step="0.0001" value="${g}"><button class="rmbtn" onclick="this.parentElement.remove()">✕</button>`;
  const sel=row.querySelector('select'),txt=row.querySelectorAll('input')[0];
  sel.onchange=()=>{if(sel.value)txt.value=sel.value;};
  if(name){const opt=[...sel.options].find(o=>o.value===name);if(!opt)sel.value='';}
  c.appendChild(row);
}

function genProd(){
  const rows=document.querySelectorAll('#orows .orow');
  const orders=[];
  for(const row of rows){const cn=row.querySelector('input[type=text]').value.trim(),qty=parseFloat(row.querySelector('input[type=number]').value);if(cn&&recipes[cn]&&qty>0)orders.push({cn,qty});else if(cn&&!recipes[cn]&&qty>0){alert('找不到色號：'+cn+'\n請確認色號是否正確');return;}}
  if(!orders.length){alert('請輸入有效訂單');return;}
  const imap={};
  const details=orders.map(o=>{
    const r=recipes[o.cn];if(!r)return null;
    const fac=(o.qty*1000)/r.total_g;
    const si=sortI(r.ingredients);
    const ings=si.map(ing=>{const sg=ing.g*fac,sk=sg/1000;imap[ing.name]=(imap[ing.name]||0)+sk;return{name:ing.name,cat:getIC(ing.name).cat||'未分類',g:sg,kg:sk};});
    return{cn:o.cn,qty:o.qty,ings};
  }).filter(Boolean);

  const now=new Date(),ds=`${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
  const totKg=orders.reduce((s,o)=>s+o.qty,0);

  let html=`<div class="sbox" id="prod-res"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;flex-wrap:wrap;gap:7px"><div class="stitle" style="margin:0">生產配方表 — ${ds}</div><button class="btn ok no-print" onclick="window.print()">🖨 列印</button>
        <button class="btn sec no-print" onclick="exportProductionExcel()">📊 匯出 Excel</button></div>
  <div class="stats-row" style="margin-bottom:13px">
    <div class="stat-card"><div class="stat-label">品項</div><div class="stat-value">${details.length}</div></div>
    <div class="stat-card"><div class="stat-label">總量</div><div class="stat-value" style="font-size:16px">${totKg.toFixed(3)} kg</div></div>
    <div class="stat-card"><div class="stat-label">原料種類</div><div class="stat-value">${Object.keys(imap).length}</div></div>
  </div>
  <div style="margin-bottom:16px"><div class="stitle">各色號詳細用料（基料→色漿→螢光粉→染料→亮粉）</div>
  <table class="ptable"><thead><tr><th>色號</th><th>訂單量(kg)</th><th>分類</th><th>原料</th><th>用量(g)</th><th>用量(kg)</th></tr></thead><tbody>`;

  details.forEach(o=>{
    o.ings.forEach((ing,idx)=>{
      const bg=CAT_BG[ing.cat]||'transparent';
      html+=`<tr>${idx===0?`<td class="cnum" rowspan="${o.ings.length}">${o.cn}</td><td class="qkg" rowspan="${o.ings.length}">${o.qty.toFixed(3)}</td>`:''}<td><span style="background:${bg};padding:1px 5px;border-radius:3px;font-size:11px">${ing.cat}</span></td><td>${ing.name}</td><td class="qkg">${ing.g.toFixed(4)}</td><td class="qkg">${ing.kg.toFixed(6)}</td></tr>`;
    });
    html+=`<tr class="ssum"><td colspan="3">小計</td><td colspan="2">${(o.qty*1000).toFixed(4)} g</td><td>${o.qty.toFixed(6)} kg</td></tr>`;
  });

  html+=`</tbody></table></div><div><div class="stitle">原料匯總需求（依分類）</div>
  <table class="ptable"><thead><tr><th>分類</th><th>原料</th><th>總需求(g)</th><th>總需求(kg)</th></tr></thead><tbody>`;

  const sortedI=Object.entries(imap).sort((a,b)=>(getIC(a[0]).order||9)-(getIC(b[0]).order||9)||(b[1]-a[1]));
  sortedI.forEach(([n,kg])=>{const cat=getIC(n).cat||'未分類';const bg=CAT_BG[cat]||'transparent';html+=`<tr><td><span style="background:${bg};padding:1px 5px;border-radius:3px;font-size:11px">${cat}</span></td><td>${n}</td><td class="qkg">${(kg*1000).toFixed(4)}</td><td class="qkg">${kg.toFixed(6)}</td></tr>`;});
  const totI=sortedI.reduce((s,[,v])=>s+v,0);
  html+=`</tbody><tfoot><tr class="ssum"><td colspan="2">總計</td><td>${(totI*1000).toFixed(4)} g</td><td>${totI.toFixed(6)} kg</td></tr></tfoot></table></div></div>`;

  // Store for Excel export
  window._prodData = {orderDetails:details, ingMap:imap, dateStr:ds, totalKg:totKg};
  document.getElementById('prod-out').innerHTML=html;
  document.getElementById('prod-out').scrollIntoView({behavior:'smooth'});
  badge(orders.length);
}

// ===== EXCEL IMPORT =====
let pendingImport = [];

function importExcel(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      parseXlsx(e.target.result);
    } catch(err) {
      alert('讀取失敗：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseXlsx(buffer) {
  // Parse xlsx manually using the same layout as the original file
  // Use SheetJS (xlsx) via CDN
  if (typeof XLSX === 'undefined') {
    // Load SheetJS dynamically
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => parseXlsxWithLib(buffer);
    script.onerror = () => alert('無法載入 Excel 解析套件，請確認網路連線');
    document.head.appendChild(script);
  } else {
    parseXlsxWithLib(buffer);
  }
  // Store buffer for retry
  window._xlsxBuffer = buffer;
}

function parseXlsxWithLib(buffer) {
  const data = new Uint8Array(buffer);
  const wb = XLSX.read(data, {type: 'array', cellFormula: false, cellNF: false});

  // Try 配方製作表 first, then first sheet
  const wsName = wb.SheetNames.find(n => n.includes('配方')) || wb.SheetNames[0];
  const ws = wb.Sheets[wsName];
  const rows = XLSX.utils.sheet_to_json(ws, {header: 1, defval: null, raw: true});

  const found = {};

  // AUTO-DETECT block positions:
  // Scan every row for cells where the NEXT row has '色料' in same column
  // This works regardless of column layout or file type
  for (let i = 0; i < rows.length - 1; i++) {
    const row = rows[i];
    const nextRow = rows[i + 1];
    if (!row || !nextRow) continue;

    for (let cn = 0; cn < row.length; cn++) {
      const val = row[cn];
      if (!val && val !== 0) continue;

      // Check if next row has '色料' at same column
      if (nextRow[cn] !== '色料') continue;

      // Check if this cell is a valid color ID
      const valStr = String(val).trim();
      const isNum = typeof val === 'number' && val >= 100 && Number.isInteger(val);
      // Match: 201-999, G01-G99, J01-J18, Nude1-6, S401+, Super, Rich, or any word+number
      const isStr = typeof val === 'string' && /^[A-Za-z一-龥]|^\d{3,}/.test(valStr) &&
                    !['色料','總量','g','0'].includes(valStr);

      if (!isNum && !isStr) continue;

      const colorId = isNum ? String(Math.round(val)) : valStr;

      // Find g column: column right after cn that has numeric header 'g' or just cn+1
      const cg = cn + 1;

      // Parse ingredients
      const ingredients = [];
      let total = null;
      for (let j = i + 2; j < Math.min(i + 13, rows.length); j++) {
        const r = rows[j];
        if (!r) break;
        const name = r[cn];
        const gVal = r[cg];

        if (name === '總量') {
          total = typeof gVal === 'number' ? gVal : null;
          break;
        }
        // Skip zero rows, empty rows
        if (!name || name === 0 || name === '色料') continue;
        if (typeof gVal !== 'number' || gVal <= 0) continue;

        const nameStr = String(name).trim();
        if (!nameStr || nameStr === '0') continue;

        ingredients.push({
          name: nameStr,
          g: Math.round(gVal * 10000) / 10000
        });
      }

      if (ingredients.length > 0) {
        found[colorId] = {
          ingredients: sortI(ingredients),
          total_g: total ? Math.round(total * 10000) / 10000
                        : Math.round(ingredients.reduce((s,i) => s + i.g, 0) * 10000) / 10000
        };
      }
    }
  }

  if (Object.keys(found).length === 0) {
    alert('找不到有效配方，請確認 Excel 格式（每個色號下方需有「色料」標題列）');
    return;
  }

  // Classify: new vs update vs same
  pendingImport = [];
  for (const [id, recipe] of Object.entries(found)) {
    pendingImport.push({
      id, recipe,
      isNew: !recipes[id],
      isDiff: recipes[id] && JSON.stringify(sortI(recipes[id].ingredients)) !== JSON.stringify(recipe.ingredients)
    });
  }

  const newCount    = pendingImport.filter(p => p.isNew).length;
  const updateCount = pendingImport.filter(p => !p.isNew && p.isDiff).length;
  const sameCount   = pendingImport.filter(p => !p.isNew && !p.isDiff).length;

    document.getElementById('import-summary').innerHTML = `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px">
      <span style="background:rgba(110,196,138,.15);color:#6ec48a;padding:4px 10px;border-radius:6px;font-size:13px">🆕 新增 ${newCount} 筆</span>
      <span style="background:rgba(126,184,201,.15);color:#7eb8c9;padding:4px 10px;border-radius:6px;font-size:13px">🔄 更新 ${updateCount} 筆</span>
      <span style="background:rgba(122,127,150,.15);color:#7a7f96;padding:4px 10px;border-radius:6px;font-size:13px">✓ 無變動 ${sameCount} 筆</span>
    </div>
    <div style="font-size:12px;color:#7a7f96;margin-top:6px">請確認後點「確認匯入」</div>`;

  const listHtml = pendingImport.map(p => {
    if (!p.isNew && !p.isDiff) return '';
    const tag = p.isNew
      ? '<span style="background:rgba(110,196,138,.15);color:#6ec48a;font-size:10px;padding:1px 6px;border-radius:3px;font-family:monospace">NEW</span>'
      : '<span style="background:rgba(126,184,201,.15);color:#7eb8c9;font-size:10px;padding:1px 6px;border-radius:3px;font-family:monospace">UPDATE</span>';
    const sr = series(p.id); const sc = SC[sr]||'s-sp';
    const ings = p.recipe.ingredients.map(i => {
      const cat = getIC(i.name).cat||'未分類';
      return `<span style="font-size:11px;color:#7a7f96">${i.name}<span style="color:#7eb8c9;font-family:monospace"> ${i.g}g</span></span>`;
    }).join(' · ');
    return `<div style="padding:9px 0;border-bottom:1px solid #2a2d3a">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px">
        ${tag}
        <span class="sbadge ${sc}">${sr}</span>
        <span style="font-family:monospace;color:#c8a96e;font-weight:500">${p.id}</span>
        <span style="font-size:11px;color:#7a7f96">${p.recipe.total_g.toFixed(2)}g</span>
      </div>
      <div style="line-height:1.8">${ings}</div>
    </div>`;
  }).filter(Boolean).join('');

  document.getElementById('import-list').innerHTML = listHtml || '<div style="color:#7a7f96;font-size:13px;padding:12px 0">所有配方皆無變動</div>';
  document.getElementById('import-confirm-btn').style.display = (newCount + updateCount > 0) ? 'inline-flex' : 'none';
  document.getElementById('import-modal').classList.add('open');
}

function confirmImport() {
  let added = 0, updated = 0;
  for (const p of pendingImport) {
    if (p.isNew || p.isDiff) {
      recipes[p.id] = p.recipe;
      if (p.isNew) added++; else updated++;
    }
  }
  saveToLS();cloudSync();
  closeM('import-modal');
  refreshAll();
  toast(`匯入完成：新增 ${added} 筆，更新 ${updated} 筆 ✓`);
  pendingImport = [];
}

  btn.textContent = '上傳中…';

function showColorSuggest(inp) {
  const q = inp.value.trim().toLowerCase();
  const suggest = inp.nextElementSibling;
  if (!q) { suggest.style.display='none'; return; }
  const matches = sortedKeys(Object.keys(recipes).filter(k => k.toLowerCase().includes(q))).slice(0, 20);
  if (!matches.length) { suggest.style.display='none'; return; }
  suggest.innerHTML = matches.map(k => {
    const sr=series(k); const sc=SC[sr]||'s-sp';
    return `<div onclick="selectColor(this,'${k}')" style="padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:13px" onmouseenter="this.style.background='var(--surface2)'" onmouseleave="this.style.background=''">
      <span class="sbadge ${sc}">${sr}</span>${k}
    </div>`;
  }).join('');
  suggest.style.display = 'block';
}

function hideColorSuggest(inp) {
  const suggest = inp.nextElementSibling;
  if (suggest) suggest.style.display = 'none';
}

function selectColor(el, colorId) {
  const suggest = el.parentElement;
  const inp = suggest.previousElementSibling;
  inp.value = colorId;
  suggest.style.display = 'none';
}

function exportProductionExcel() {

}

function doExportProductionExcel() {
  const { orderDetails, ingMap } = window._prodData;
  const catOrd = {'基料':1,'色漿':2,'螢光粉':3,'染料':4,'亮粉':5,'未分類':9};

  // ── XML Excel (SpreadsheetML) with full style support ──
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Style indices
  // 0=normal, 1=header(grey+bold+center+border), 2=sum(blue+bold+center+border), 3=data(center+border), 4=data-left+border, 5=num(center+border+2dp)
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <fonts>
    <font><sz val="11"/><name val="Calibri"/></font>
    <font><sz val="11"/><b/><name val="Calibri"/></font>
  </fonts>
  <fills>
    <fill><patternFill patternType="none"/></fill>
    <fill><patternFill patternType="gray125"/></fill>
    <fill><patternFill patternType="solid"><fgColor rgb="FFD9D9D9"/></patternFill></fill>
    <fill><patternFill patternType="solid"><fgColor rgb="FFBDD7EE"/></patternFill></fill>
  </fills>
  <borders>
    <border><left/><right/><top/><bottom/></border>
    <border>
      <left style="thin"><color rgb="FF000000"/></left>
      <right style="thin"><color rgb="FF000000"/></right>
      <top style="thin"><color rgb="FF000000"/></top>
      <bottom style="thin"><color rgb="FF000000"/></bottom>
    </border>
  </borders>
  <cellStyleXfs><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
  <cellXfs>
    <xf numFmtId="0"  fontId="0" fillId="0" borderId="0" xfId="0"/>
    <xf numFmtId="0"  fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
    <xf numFmtId="0"  fontId="1" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
    <xf numFmtId="0"  fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
    <xf numFmtId="0"  fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="left"   vertical="center"/></xf>
    <xf numFmtId="2"  fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1" applyNumberFormat="1"><alignment horizontal="center" vertical="center"/></xf>
    <xf numFmtId="2"  fontId="1" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1" applyNumberFormat="1"><alignment horizontal="center" vertical="center"/></xf>
    <xf numFmtId="2"  fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1" applyNumberFormat="1"><alignment horizontal="center" vertical="center"/></xf>
  </cellXfs>
</styleSheet>`;
  // Style index reference:
  // 1=header(grey bold center), 2=sum(blue bold center), 3=center border
  // 4=left border, 5=num center border, 6=num sum blue, 7=num header grey

  function nCell(v, s) { // number cell
    return `<c t="n" s="${s}"><v>${v}</v></c>`;
  }
  function sCell(v, s) { // string cell
    return `<c t="inlineStr" s="${s}"><is><t>${esc(v)}</t></is></c>`;
  }
  function eCell(s) { // empty cell with style
    return `<c t="inlineStr" s="${s}"><is><t></t></is></c>`;
  }

  // Build Sheet 1
  let s1rows = '';
  let merges1 = [];
  let rowIdx = 2; // 1-based, row 1 = header

  // Header row
  s1rows += `<row r="1" ht="20" customHeight="1">
    ${sCell('色號',1)}${sCell('訂單量(kg)',1)}${sCell('分類',1)}${sCell('原料',1)}${sCell('用量(g)',1)}
  </row>\n`;

  orderDetails.forEach(o => {
    const startR = rowIdx;
    o.ings.forEach((ing, idx) => {
      const c1 = idx===0 ? sCell(String(o.cn), 3) : eCell(3);
      const c2 = idx===0 ? nCell(parseFloat(o.qty.toFixed(2)), 5) : eCell(5);
      s1rows += `<row r="${rowIdx}" ht="18" customHeight="1">
        ${c1}${c2}${sCell(ing.cat,3)}${sCell(ing.name,4)}${nCell(parseFloat(ing.g.toFixed(2)),5)}
      </row>\n`;
      rowIdx++;
    });
    if (o.ings.length > 1) {
      merges1.push(`<mergeCell ref="A${startR}:A${rowIdx-1}"/>`);
      merges1.push(`<mergeCell ref="B${startR}:B${rowIdx-1}"/>`);
    }
    // 小計
    s1rows += `<row r="${rowIdx}" ht="18" customHeight="1">
      ${sCell('小計',2)}${eCell(2)}${eCell(2)}${eCell(2)}${nCell(parseFloat((o.qty*1000).toFixed(2)),6)}
    </row>\n`;
    merges1.push(`<mergeCell ref="A${rowIdx}:D${rowIdx}"/>`);
    rowIdx++;
  });

  const sheet1 = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <sheetFormatPr defaultRowHeight="18"/>

  // Build Sheet 2

  s2rows += `<row r="1" ht="20" customHeight="1">
    ${sCell('分類',1)}${sCell('原料',1)}${sCell('總需求(g)',1)}
  </row>\n`;

  const sortedI = Object.entries(ingMap).sort((a,b)=>
    (catOrd[getIC(a[0]).cat||'未分類']||9)-(catOrd[getIC(b[0]).cat||'未分類']||9)||(b[1]-a[1])
  );
  sortedI.forEach(([name,kg]) => {
    s2rows += `<row r="${r2}" ht="18" customHeight="1">
      ${sCell(getIC(name).cat||'未分類',3)}${sCell(name,4)}${nCell(parseFloat((kg*1000).toFixed(2)),5)}
    </row>\n`;
    r2++;
  });
  const totI = sortedI.reduce((s,[,v])=>s+v,0);
  s2rows += `<row r="${r2}" ht="18" customHeight="1">
    ${sCell('總計',2)}${eCell(2)}${nCell(parseFloat((totI*1000).toFixed(2)),6)}
  </row>\n`;

  const sheet2 = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <sheetFormatPr defaultRowHeight="18"/>
  <cols>
    <col min="1" max="1" width="10" customWidth="1"/>
    <col min="2" max="2" width="20" customWidth="1"/>
    <col min="3" max="3" width="14" customWidth="1"/>
  </cols>
  <sheetData>${s2rows}</sheetData>
</worksheet>`;

  // ── Assemble ZIP (xlsx) manually ──
  const now = new Date();
  const fname = `AP生產配方表_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.xlsx`;

  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;

  const wbXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
          xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheets>
    <sheet name="各色號詳細用料" sheetId="1" r:id="rId1"/>
    <sheet name="原料匯總需求"   sheetId="2" r:id="rId2"/>
  </sheets>
</workbook>`;

  const wbRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>
  <Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles"    Target="styles.xml"/>
</Relationships>`;

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml"  ContentType="application/xml"/>
  <Override PartName="/xl/workbook.xml"            ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
  <Override PartName="/xl/worksheets/sheet1.xml"   ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
  <Override PartName="/xl/worksheets/sheet2.xml"   ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
  <Override PartName="/xl/styles.xml"              ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`;

  // Use JSZip (bundled with SheetJS CDN) or load separately
  function buildZip() {
    const zip = new JSZip();
    zip.file('[Content_Types].xml', contentTypes);
    zip.file('_rels/.rels', rels);
    zip.file('xl/workbook.xml', wbXml);
    zip.file('xl/_rels/workbook.xml.rels', wbRels);
    zip.file('xl/styles.xml', styles);
    zip.file('xl/worksheets/sheet1.xml', sheet1);
    zip.file('xl/worksheets/sheet2.xml', sheet2);
    zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})
      .then(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fname; a.click();
        URL.revokeObjectURL(url);
      });
  }

  if (typeof JSZip === 'undefined') {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = buildZip;
    s.onerror = () => alert('無法載入 JSZip，請確認網路連線');
    document.head.appendChild(s);
  } else {
    buildZip();
  }
}

  el.textContent = '步驟2: 確認 Firebase...';
  if (typeof window.saveToCloud !== 'function') {
    el.textContent = '❌ saveToCloud 未定義'; el.style.color='var(--danger)'; return;
  }
  el.textContent = '步驟2 ✓ Firebase 函數存在';
  await new Promise(r => setTimeout(r, 800));

  // Step 3: 寫入測試
  el.textContent = '步驟3: 寫入 ' + count + ' 筆到雲端...';
  try {
    const ok = await window.saveToCloud(data);
    if (ok) {
      el.textContent = '✅ 成功！已上傳 ' + count + ' 筆';
      el.style.color = 'var(--success)';
    } else {
      el.textContent = '❌ 寫入回傳失敗';
      el.style.color = 'var(--danger)';
    }
  } catch(e) {
    el.textContent = '❌ 錯誤: ' + e.message;
    el.style.color = 'var(--danger)';
  }
};
function testFirebase() { window.testFirebase(); }


window.downloadCloudData = async function() {
  const el = document.getElementById('sync-status');
  el.style.opacity = '1';
  el.style.color = 'var(--accent2)';
  el.textContent = '讀取雲端資料中...';

  if (typeof window.saveToCloud !== 'function') {
    el.textContent = '❌ Firebase 未連線'; el.style.color='var(--danger)'; return;
  }

  try {
    // Use getDoc via a workaround - call reloadFromCloud but intercept
    // Actually just download current local recipes AND trigger a fresh getDoc
    // We need to expose getDoc - let's add it to window in the module

    if (typeof window._getCloudRaw !== 'function') {
      el.textContent = '❌ 需要更新版本才能下載雲端資料';
      el.style.color = 'var(--danger)';
      return;
    }

    const raw = await window._getCloudRaw();
    if (!raw) {
      el.textContent = '❌ 雲端無資料'; el.style.color='var(--danger)'; return;
    }

    const cloudCount = Object.keys(raw).length;
    const localCount = Object.keys(window._getRecipes()).length;

    // Download as JSON
    const blob = new Blob([JSON.stringify({
      cloud_count: cloudCount,
      local_count: localCount,
      cloud_data: raw
    }, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'firebase_cloud_data.json';
    a.click();
    URL.revokeObjectURL(url);

    el.textContent = '✅ 雲端:' + cloudCount + '筆 / 本機:' + localCount + '筆';
    el.style.color = cloudCount === localCount ? 'var(--success)' : 'var(--danger)';
  } catch(e) {
    el.textContent = '❌ ' + e.message; el.style.color='var(--danger)';
  }
};
function downloadCloudData() { window.downloadCloudData(); }


function renderCustomerList() {
  const c = document.getElementById('customer-list');
  if (!c) return;
  c.innerHTML = customers.filter(x=>x.id!=='all').map(cu => `
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px">
      <span style="font-weight:500;color:var(--accent)">${cu.name}</span>
      <span style="font-size:11px;color:var(--text-muted)">${cu.patterns.map(p=>p.replace('num:','').replace('prefix:','')).join(', ')}</span>
      <button onclick="deleteCustomer('${cu.id}')" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;margin-left:auto">✕</button>
    </div>`).join('');
}

function addCustomer() {
  const name = document.getElementById('new-customer-name').value.trim();
  const pat  = document.getElementById('new-customer-pattern').value.trim();
  if (!name || !pat) { alert('請輸入客戶名稱和色號範圍'); return; }

  // Parse pattern: "201-364" -> num:201-364, "S" or "CE" -> prefix:S
  let pattern;
  if (/^\d+-\d+$/.test(pat)) {
    pattern = 'num:' + pat;
  } else {
    pattern = 'prefix:' + pat.replace(/[^A-Za-z]/g,'');
  }

  const id = name.toLowerCase().replace(/\s+/g,'_') + '_' + Date.now();
  customers.push({ id, name, patterns:[pattern] });
  saveCustomers();
  buildCustomerSelect();
  renderCustomerList();
  document.getElementById('new-customer-name').value = '';
  document.getElementById('new-customer-pattern').value = '';
  toast('客戶「' + name + '」已新增 ✓');
  cloudSync();
}

function deleteCustomer(id) {
  const c = customers.find(x=>x.id===id);
  if (!c) return;
  if (!confirm('確定刪除客戶「' + c.name + '」？')) return;
  customers = customers.filter(x=>x.id!==id);
  if (currentCustomer === id) { currentCustomer='all'; localStorage.setItem('ap_current_customer','all'); }
  saveCustomers();
  buildCustomerSelect();
  renderCustomerList();
  filterSearch(); filterManage();
  toast('客戶已刪除');
  cloudSync();
}

function saveMaterials() {
  localStorage.setItem('ap_materials', JSON.stringify(materials));
}

function addMaterial() {
  const name = document.getElementById('mat-name').value.trim();
  const cat  = document.getElementById('mat-cat').value;
  const note = document.getElementById('mat-note').value.trim();
  if (!name) { alert('請輸入材料名稱'); return; }
  if (materials.find(m => m.name === name)) { alert('材料「' + name + '」已存在'); return; }
  materials.push({ name, cat, note });
  saveMaterials();
  cloudSyncMaterials();
  renderMaterials();
  updateMatStats();
  document.getElementById('mat-name').value = '';
  document.getElementById('mat-note').value = '';
  toast('材料「' + name + '」已新增 ✓');
}

function deleteMaterial(name) {
  if (!confirm('確定刪除材料「' + name + '」？')) return;
  materials = materials.filter(m => m.name !== name);
  saveMaterials();
  cloudSyncMaterials();
  renderMaterials();
  updateMatStats();
  toast('材料「' + name + '」已刪除');
}

function editMaterialNote(name, note) {
  const m = materials.find(x => x.name === name);
  if (m) { m.note = note; saveMaterials(); cloudSyncMaterials(); }
}

function editMaterialCat(name, cat) {
  const m = materials.find(x => x.name === name);
  if (m) { m.cat = cat; saveMaterials(); cloudSyncMaterials(); renderMaterials(); }
}

function renderMaterials() {
  const q   = (document.getElementById('mat-search')?.value || '').trim().toLowerCase();
  const cat = document.getElementById('mat-filter-cat')?.value || '';
  const filtered = materials.filter(m => {
    if (cat && m.cat !== cat) return false;
    if (q && !m.name.toLowerCase().includes(q) && !m.note.toLowerCase().includes(q)) return false;
    return true;
  });

  // Group by category
  const groups = {};
  for (const m of filtered) {
    if (!groups[m.cat]) groups[m.cat] = [];
    groups[m.cat].push(m);
  }

  const catOrder = ['基料','色漿','螢光粉','染料','亮粉','其他'];
  let html = '';

  for (const cat of catOrder) {
    if (!groups[cat]) continue;
    const style = MAT_CAT_COLORS[cat] || MAT_CAT_COLORS['其他'];
    html += `<div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
        color:${style.color};background:${style.bg};padding:5px 12px;border-radius:6px;
        display:inline-block;margin-bottom:8px">${cat}（${groups[cat].length}）</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px">`;

    for (const m of groups[cat].sort((a,b)=>a.name.localeCompare(b.name,'zh-TW'))) {
      html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:8px">
        <span style="font-weight:500;font-family:'DM Mono',monospace;flex:1;font-size:13px">${m.name}</span>
        <select onchange="editMaterialCat('${m.name}',this.value)"
          style="background:${style.bg};color:${style.color};border:none;font-size:11px;padding:2px 4px;border-radius:4px;cursor:pointer;font-family:'Noto Sans TC',sans-serif">
          ${catOrder.map(c=>`<option value="${c}" ${c===m.cat?'selected':''}>${c}</option>`).join('')}
        </select>
        <input type="text" value="${m.note}" placeholder="備註"
          onblur="editMaterialNote('${m.name}',this.value)"
          style="background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);
            padding:3px 7px;border-radius:4px;font-size:11px;width:90px;font-family:'Noto Sans TC',sans-serif">
        <button onclick="deleteMaterial('${m.name}')"
          style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:2px">✕</button>
      </div>`;
    }
    html += '</div></div>';
  }

  if (!html) html = '<div class="empty"><div style="font-size:40px">🧪</div>找不到符合的材料</div>';
  document.getElementById('mat-list').innerHTML = html;
  updateMatStats();
}

function updateMatStats() {
  const t = document.getElementById('mat-total');
  const c = document.getElementById('mat-cats');
  if (t) t.textContent = materials.length;
  if (c) c.textContent = [...new Set(materials.map(m=>m.cat))].length;
}

function cloudSyncMaterials() {
  if (window.saveToCloud && window._fsReady) {
    window.saveToCloud(recipes, customers, materials);
  }
}

function initMaterials() {
  renderMaterials();
}

</script>
